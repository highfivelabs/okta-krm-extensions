# An empty hfl-live group, given the hfl-live custom role over an hfl-live
# resource set (a group): it grants nobody anything.
- kind: AdminRoleCustomAssignments
  replaceSample: true
  before:
  - {method: GET, path: /.well-known/openid-configuration, save: {arcaIssuer: issuer}}
  - {method: GET, path: /api/v1/org, save: {arcaOrg: id}}
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-t"}}, save: {arcaTarget: id}}
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-m"}}, save: {arcaMember: id}}
  - {method: POST, path: /api/v1/iam/resource-sets, body: {label: "{{name}}-rs", description: hfl-live, resources: ["orn:okta:directory:{{var:arcaOrg}}:groups:{{var:arcaTarget}}"]}, save: {arcaRS: id}}
  - {method: POST, path: /api/v1/iam/roles, body: {label: "{{name}}-r", description: hfl-live, permissions: [okta.users.read]}, save: {arcaRole: id}}
  after:
  - {method: DELETE, path: "/api/v1/iam/resource-sets/{{var:arcaRS}}/bindings/{{var:arcaRole}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/iam/resource-sets/{{var:arcaRS}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/iam/roles/{{var:arcaRole}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:arcaMember}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:arcaTarget}}", ok: [404]}
  spec: {resourcesetidorlabel: "{{var:arcaRS}}", role: "{{var:arcaRole}}", members: ["{{var:arcaIssuer}}/api/v1/groups/{{var:arcaMember}}"]}

# A group target on a group membership administrator role of an hfl-live user
# (made with activate=false). Okta refuses to remove a role's last group
# target, so the before calls give the role a first one.
- kind: AdminRoleGroupTarget
  replaceSample: true
  before:
  - {method: POST, path: "/api/v1/users?activate=false", body: {profile: {firstName: hfl, lastName: live, email: "{{name}}-u@example.com", login: "{{name}}-u@example.com"}}, save: {argUser: id}}
  - {method: POST, path: "/api/v1/users/{{var:argUser}}/roles?disableNotifications=true", body: {type: GROUP_MEMBERSHIP_ADMIN}, save: {argRole: id}}
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g1"}}, save: {argKeep: id}}
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g2"}}, save: {argGroup: id}}
  - {method: PUT, path: "/api/v1/users/{{var:argUser}}/roles/{{var:argRole}}/targets/groups/{{var:argKeep}}"}
  after:
  - {method: DELETE, path: "/api/v1/users/{{var:argUser}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:argUser}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:argGroup}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:argKeep}}", ok: [404]}
  spec: {userid: "{{var:argUser}}", roleassignmentid: "{{var:argRole}}", groupid: "{{var:argGroup}}"}

# An hfl-live app moved onto a new app sign-in policy (an hfl-live one); both
# are deleted after.
- kind: AppPolicyAssignment
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/apps, body: {label: "{{name}}-app", signOnMode: AUTO_LOGIN, visibility: {autoSubmitToolbar: false, hide: {iOS: false, web: false}}, settings: {signOn: {loginUrl: "https://{{name}}.example.com/login"}}}, save: {apaApp: id}}
  - {method: POST, path: /api/v1/policies, body: {name: "{{name}}-p", type: ACCESS_POLICY}, save: {apaPolicy: id}}
  after:
  - {method: POST, path: "/api/v1/apps/{{var:apaApp}}/lifecycle/deactivate", ok: [404]}
  - {method: DELETE, path: "/api/v1/apps/{{var:apaApp}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/policies/{{var:apaPolicy}}", ok: [404]}
  spec: {appid: "{{var:apaApp}}", policyid: "{{var:apaPolicy}}"}
  noUpdate: "the assignment has no field but its app and policy, both path parameters"

# okta.users.read granted to an hfl-live service app that has no client
# secret (private_key_jwt against a JWKS URL that serves no key): nothing can
# get a token with it. The issuer is the org's own URL.
- kind: AppOauthApiScope
  replaceSample: true
  before:
  - {method: GET, path: /.well-known/openid-configuration, save: {aoasIssuer: issuer}}
  - method: POST
    path: /api/v1/apps
    body:
      name: oidc_client
      label: "{{name}}-app"
      signOnMode: OPENID_CONNECT
      credentials: {oauthClient: {token_endpoint_auth_method: private_key_jwt}}
      settings: {oauthClient: {grant_types: [client_credentials], response_types: [token], application_type: service, jwks_uri: "https://www.example.com/{{name}}/jwks"}}
    save: {aoasApp: id}
  after:
  - {method: POST, path: "/api/v1/apps/{{var:aoasApp}}/lifecycle/deactivate", ok: [404]}
  - {method: DELETE, path: "/api/v1/apps/{{var:aoasApp}}", ok: [404]}
  spec: {appid: "{{var:aoasApp}}", issuer: "{{var:aoasIssuer}}", scopeId: okta.users.read}

# Read-only administrator, for an hfl-live service app that has no client
# secret (as above).
- kind: ClientRoleAssignment
  replaceSample: true
  before:
  - method: POST
    path: /api/v1/apps
    body:
      name: oidc_client
      label: "{{name}}-app"
      signOnMode: OPENID_CONNECT
      credentials: {oauthClient: {token_endpoint_auth_method: private_key_jwt}}
      settings: {oauthClient: {grant_types: [client_credentials], response_types: [token], application_type: service, jwks_uri: "https://www.example.com/{{name}}/jwks"}}
    save: {craApp: id, craClient: credentials/oauthClient/client_id}
  after:
  - {method: POST, path: "/api/v1/apps/{{var:craApp}}/lifecycle/deactivate", ok: [404]}
  - {method: DELETE, path: "/api/v1/apps/{{var:craApp}}", ok: [404]}
  spec: {clientid: "{{var:craClient}}", type: READ_ONLY_ADMIN}

# An hfl-live user (made with activate=false) in an hfl-live group.
- kind: GroupMembership
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g"}}, save: {gmGroup: id}}
  - {method: POST, path: "/api/v1/users?activate=false", body: {profile: {firstName: hfl, lastName: live, email: "{{name}}-u@example.com", login: "{{name}}-u@example.com"}}, save: {gmUser: id}}
  after:
  - {method: DELETE, path: "/api/v1/users/{{var:gmUser}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:gmUser}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:gmGroup}}", ok: [404]}
  spec: {groupid: "{{var:gmGroup}}", userid: "{{var:gmUser}}"}

