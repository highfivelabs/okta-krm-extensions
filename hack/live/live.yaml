# Read-only administrator, for an empty hfl-live group.
- kind: GroupRole
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g"}}, save: {grGroup: id}}
  after:
  - {method: DELETE, path: "/api/v1/groups/{{var:grGroup}}", ok: [404]}
  spec: {groupid: "{{var:grGroup}}", type: READ_ONLY_ADMIN}

# Made inactive (Okta's default), into an hfl-live group, matching nobody.
- kind: GroupRule
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g"}}, save: {grlGroup: id}}
  after:
  - {method: DELETE, path: "/api/v1/groups/{{var:grlGroup}}", ok: [404]}
  spec:
    name: "{{name}}"
    type: group_rule
    conditions: {expression: {type: "urn:okta:expression:1.0", value: 'user.login == "{{name}}@example.com"'}}
    actions: {assignUserToGroups: {groupIds: ["{{var:grlGroup}}"]}}
  change: {name: "{{name}}-2"}
  driftFull: true

# A Google IdP that no routing rule names: nobody is sent to it. (Once, its
# delete right after the deactivation did not take: it stayed readable for
# minutes, until the cleanup deleted it again.)
- kind: IdentityProvider
  replaceSample: true
  deleteWait: 3m
  spec:
    type: GOOGLE
    name: "{{name}}"
    issuerMode: ORG_URL
    protocol: {type: OIDC, scopes: [email, openid, profile], credentials: {client: {client_id: hfl-live-client, client_secret: hfl-live-secret}}}
    policy:
      provisioning: {action: AUTO, profileMaster: false, groups: {action: NONE}}
      accountLink: {action: AUTO}
      subject: {userNameTemplate: {template: idpuser.email}, matchType: USERNAME}
      maxClockSkew: 0
  change: {name: "{{name}}-2"}
  driftFull: true

