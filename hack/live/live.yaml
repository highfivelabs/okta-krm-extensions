# Okta makes a brand named after a new custom domain, and keeps it when the
# domain is deleted; the brands sweep entry deletes it on a later run.
- kind: Domain
  replaceSample: true
  spec: {domain: "{{name}}.example.com", certificateSourceType: MANUAL}
  noUpdate: "the update takes only brandId, which the CRD (the create's schema) has no field for"

- kind: EmailDomain
  replaceSample: true
  stays: "a deleted email domain still reads back, with validationStatus DELETED"
  before:
  - {method: POST, path: /api/v1/brands, body: {name: "{{name}}-b"}, save: {edBrand: id}}
  after:
  - {method: DELETE, path: "/api/v1/brands/{{var:edBrand}}", ok: [404]}
  spec: {brandId: "{{var:edBrand}}", domain: "{{name}}.example.com", displayName: first, userName: noreply}
  change: {displayName: second}
  noDrift: "the update takes only displayName, userName and refuses the object as read (400 E0000003); the update step covers the write"

