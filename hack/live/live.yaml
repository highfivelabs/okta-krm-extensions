# A link definition of the run's, and three users made for it (never
# activated): the first is the primary, the other two its associated users.
- kind: LinkValue
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/meta/schemas/user/linkedObjects, body: {primary: {name: "{{name_}}_lm", title: Manager, description: hfl-live, type: USER}, associated: {name: "{{name_}}_lr", title: Report, description: hfl-live, type: USER}}}
  - {method: POST, path: "/api/v1/users?activate=false", body: {profile: {firstName: hfl, lastName: live, email: "{{name}}-p@example.com", login: "{{name}}-p@example.com"}}, save: {lvPrimary: id}}
  - {method: POST, path: "/api/v1/users?activate=false", body: {profile: {firstName: hfl, lastName: live, email: "{{name}}-a@example.com", login: "{{name}}-a@example.com"}}, save: {lvA: id}}
  - {method: POST, path: "/api/v1/users?activate=false", body: {profile: {firstName: hfl, lastName: live, email: "{{name}}-b@example.com", login: "{{name}}-b@example.com"}}, save: {lvB: id}}
  after:
  - {method: DELETE, path: "/api/v1/users/{{var:lvA}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:lvA}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:lvB}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:lvB}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:lvPrimary}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:lvPrimary}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/meta/schemas/user/linkedObjects/{{name_}}_lm", ok: [404]}
  spec: {primaryName: "{{name_}}_lm", associatedName: "{{name_}}_lr", primaryUserId: "{{var:lvPrimary}}", associatedUserIds: ["{{var:lvA}}", "{{var:lvB}}"]}
