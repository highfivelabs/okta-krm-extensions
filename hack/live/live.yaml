- kind: TrustedOrigin
  replaceSample: true
  spec: {name: "{{name}}", origin: "https://{{name}}.example.com", scopes: [{type: CORS}]}
  change: {name: "{{name}}-2"}
  driftFull: true

- kind: UserType
  replaceSample: true
  spec: {name: "{{name_}}", displayName: "{{name}}", description: first}
  change: {description: second}
  driftFull: true

- kind: HookKey
  replaceSample: true
  spec: {name: "{{name}}"}
  change: {name: "{{name}}-2"}

- kind: Group
