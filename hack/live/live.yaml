  - {method: POST, path: /api/v1/authorizationServers, body: {name: "{{name}}-as", description: hfl-live, audiences: ["api://{{name}}"]}, save: {asrAS: id}}
  - {method: POST, path: "/api/v1/authorizationServers/{{var:asrAS}}/policies", body: {name: "{{name}}-p", description: hfl-live, type: OAUTH_AUTHORIZATION_POLICY, priority: 1, conditions: {clients: {include: [ALL_CLIENTS]}}}, save: {asrPolicy: id}}
