# An app sign-in policy assigned to no app: it applies to nobody.
- kind: Policy
  replaceSample: true
  spec: {name: "{{name}}", type: ACCESS_POLICY, description: first}
  change: {description: second}
  driftFull: true

# A rule of a new app sign-in policy (assigned to no app), for an hfl-live group.
- kind: PolicyRule
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/policies, body: {name: "{{name}}-p", type: ACCESS_POLICY}, save: {prPolicy: id}}
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g"}}, save: {prGroup: id}}
  after:
  - {method: DELETE, path: "/api/v1/policies/{{var:prPolicy}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:prGroup}}", ok: [404]}
  spec:
    policyid: "{{var:prPolicy}}"
    name: "{{name}}"
    type: ACCESS_POLICY
    conditions: {people: {groups: {include: ["{{var:prGroup}}"]}}}
    actions: {appSignOn: {access: ALLOW, verificationMethod: {type: ASSURANCE, factorMode: 2FA, reauthenticateIn: PT2H, constraints: [{possession: {required: true}}]}}}
  change: {name: "{{name}}-2"}
  driftFull: true

