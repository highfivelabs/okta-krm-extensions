#
# Live tests (TestEveryKindLive, krm-rest-runtime's kindtest.Live): these
# kinds, in this order, against the real API. Kinds not listed are not run
# live. They skip, naming the secret, until it exists in Secret Manager; then
#   KRM_LIVE=1 go test -tags live -run TestEveryKindLive -v .
# Everything a run makes is named hfl-live-<stamp>-<hex> (or hfl_live_...),
# deleted at the end; the sweep deletes older leftovers. How it works and
# what the {{...}} templates mean: krm-rest-runtime docs/live.md.
#
# The token is an API token (SSWS) of the Integrator org's only user, a
# super administrator: locking that user out is the worst outcome. So no
# kind here touches the admin user, the Everyone or Okta Administrators
# groups, the built-in apps, the default policies, the org's authenticators
# or anything org-wide a sign-in depends on. Policies, rules, roles and
# assignments act only on hfl-live- groups, users, apps and authorization
# servers made for the test. Users are made with activate=false, at
# @example.com: no email reaches anyone.
secret: krm-live-okta           # JSON: {"apiToken": "00...", "baseURL": "https://integrator-NNNNNNN.okta.com"}
target: Okta Integrator org
# The org's own ID (GET /api/v1/org's id, in every orn:okta:... and orgId)
# names the test account: redacted wherever it is.
redactVars: [orgId, arcaOrg]
redactFields: [orgId]

# Only names starting hfl-live- (or hfl_live_) are ever deleted. A user takes
# two DELETEs (deactivate, then delete), so users are listed twice.
sweep:
- {list: "/api/v1/trustedOrigins?q=hfl-live-", name: name, id: id, delete: "/api/v1/trustedOrigins/{id}"}
- {list: /api/v1/meta/types/user, name: name, id: id, delete: "/api/v1/meta/types/user/{id}"}
- {list: /api/v1/hook-keys, name: name, id: id, delete: "/api/v1/hook-keys/{id}"}
- {list: "/api/v1/apps?q=hfl-live-", name: label, id: id, before: "/api/v1/apps/{id}/lifecycle/deactivate", delete: "/api/v1/apps/{id}"}
- {list: "/api/v1/groups/rules?search=hfl-live-", name: name, id: id, delete: "/api/v1/groups/rules/{id}"}
- {list: "/api/v1/groups?q=hfl-live-", name: profile/name, id: id, delete: "/api/v1/groups/{id}"}
- {list: "/api/v1/users?q=hfl-live-", name: profile/login, id: id, delete: "/api/v1/users/{id}"}
- {list: "/api/v1/users?q=hfl-live-", name: profile/login, id: id, delete: "/api/v1/users/{id}"}
- {list: "/api/v1/policies?type=ACCESS_POLICY", name: name, id: id, delete: "/api/v1/policies/{id}"}
- {list: /api/v1/iam/roles, items: roles, name: label, id: id, delete: "/api/v1/iam/roles/{id}"}
- {list: /api/v1/iam/resource-sets, items: resource-sets, name: label, id: id, delete: "/api/v1/iam/resource-sets/{id}"}
- {list: /api/v1/device-assurances, name: name, id: id, delete: "/api/v1/device-assurances/{id}"}
- {list: /api/v1/brands, name: name, id: id, delete: "/api/v1/brands/{id}"}
- {list: /api/v1/captchas, name: name, id: id, delete: "/api/v1/captchas/{id}"}
- {list: /api/v1/templates/sms, name: name, id: id, delete: "/api/v1/templates/sms/{id}"}
- {list: /api/v1/meta/uischemas, name: uiSchema/label, id: id, delete: "/api/v1/meta/uischemas/{id}"}
- {list: /api/v1/meta/schemas/user/linkedObjects, name: primary/name, id: primary/name, delete: "/api/v1/meta/schemas/user/linkedObjects/{id}"}
- {list: /api/v1/push-providers, name: name, id: id, delete: "/api/v1/push-providers/{id}"}
- {list: /api/v1/security-events-providers, name: name, id: id, delete: "/api/v1/security-events-providers/{id}"}
- {list: /api/v1/domains, items: domains, name: domain, id: id, delete: "/api/v1/domains/{id}"}

