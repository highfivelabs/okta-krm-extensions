  after:
  - {method: DELETE, path: "/api/v1/groups/{{var:rsGroup}}", ok: [404]}
  spec: {label: "{{name}}", description: first, resources: ["orn:okta:directory:{{var:orgId}}:groups:{{var:rsGroup}}"]}
  change: {description: second}
  driftFull: true

- kind: Application
  replaceSample: true
  spec: {label: "{{name}}", signOnMode: AUTO_LOGIN, visibility: {autoSubmitToolbar: false, hide: {iOS: false, web: false}}, settings: {signOn: {loginUrl: "https://{{name}}.example.com/login"}}}
  change: {label: "{{name}}-2"}
  driftFull: true

- kind: AppGroupAssignment
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/apps, body: {label: "{{name}}-app", signOnMode: AUTO_LOGIN, visibility: {autoSubmitToolbar: false, hide: {iOS: false, web: false}}, settings: {signOn: {loginUrl: "https://{{name}}.example.com/login"}}}, save: {agaApp: id}}
  - {method: POST, path: /api/v1/groups, body: {profile: {name: "{{name}}-g"}}, save: {agaGroup: id}}
  after:
  - {method: POST, path: "/api/v1/apps/{{var:agaApp}}/lifecycle/deactivate", ok: [404]}
  - {method: DELETE, path: "/api/v1/apps/{{var:agaApp}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/groups/{{var:agaGroup}}", ok: [404]}
  spec: {appid: "{{var:agaApp}}", groupid: "{{var:agaGroup}}", priority: 0}
  change: {priority: 1}
  drift: 2

- kind: AppUser
  replaceSample: true
  before:
  - {method: POST, path: /api/v1/apps, body: {label: "{{name}}-app", signOnMode: AUTO_LOGIN, visibility: {autoSubmitToolbar: false, hide: {iOS: false, web: false}}, settings: {signOn: {loginUrl: "https://{{name}}.example.com/login"}}}, save: {auApp: id}}
  - {method: POST, path: "/api/v1/users?activate=false", body: {profile: {firstName: hfl, lastName: live, email: "{{name}}-u@example.com", login: "{{name}}-u@example.com"}}, save: {auUser: id}}
  after:
  - {method: POST, path: "/api/v1/apps/{{var:auApp}}/lifecycle/deactivate", ok: [404]}
  - {method: DELETE, path: "/api/v1/apps/{{var:auApp}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:auUser}}", ok: [404]}
  - {method: DELETE, path: "/api/v1/users/{{var:auUser}}", ok: [404]}
